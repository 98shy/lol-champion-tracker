<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="리그 오브 레전드 챔피언 사용 현황을 한눈에 기록하는 체크리스트" />
    <title>룽바람 랜드 | LoL Champion Tracker</title>
    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" />
    <link rel="preload" as="image" href="assets/hero-aram-land-v3.jpg" />
    <link rel="stylesheet" href="styles.css?v=14" />
    <script src="app.js?v=6" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero__brand">
          <h1>룽바람 랜드</h1>
          <p>사용한 챔피언을 제외하고 현재 승패를 기록하세요.</p>
        </div>

        <div class="hero__dashboard">
          <section class="record-card" aria-label="현재 승패 기록">
            <div class="record-card__summary">
              <div>
                <span class="record-card__label">현재 전적</span>
                <strong><span id="winCount">0</span>승 <span id="lossCount">0</span>패</strong>
              </div>
              <div class="win-rate">
                <span>승률</span>
                <strong id="winRate">—</strong>
              </div>
            </div>
            <div class="record-card__controls">
              <div class="score-control score-control--win">
                <span>승리</span>
                <button type="button" data-record="win" data-delta="-1" aria-label="승리 1회 줄이기">−</button>
                <strong id="winControlCount">0</strong>
                <button type="button" data-record="win" data-delta="1" aria-label="승리 1회 추가">+</button>
              </div>
              <div class="score-control score-control--loss">
                <span>패배</span>
                <button type="button" data-record="loss" data-delta="-1" aria-label="패배 1회 줄이기">−</button>
                <strong id="lossControlCount">0</strong>
                <button type="button" data-record="loss" data-delta="1" aria-label="패배 1회 추가">+</button>
              </div>
              <button id="recordResetButton" class="record-reset" type="button">전적 초기화</button>
            </div>
            <div class="settlement">
              <div class="settlement__stake">
                <span>판당 별풍선</span>
                <strong id="stakeCount">100개</strong>
              </div>
              <div id="stakeControls" class="stake-controls" aria-label="판당 별풍선 조절">
                <button type="button" data-stake-delta="-1000" aria-label="판당 별풍선 1000개 줄이기">−1천</button>
                <button type="button" data-stake-delta="-100" aria-label="판당 별풍선 100개 줄이기">−100</button>
                <button type="button" data-stake-delta="100" aria-label="판당 별풍선 100개 늘리기">+100</button>
                <button type="button" data-stake-delta="1000" aria-label="판당 별풍선 1000개 늘리기">+1천</button>
              </div>
              <div class="settlement__result">
                <span>최종 결산</span>
                <strong id="settlementResult" aria-live="polite">0개</strong>
              </div>
            </div>
          </section>
        </div>
      </header>

      <main>
        <section class="toolbar" aria-label="챔피언 목록 필터">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z" /></svg>
            <label class="sr-only" for="searchInput">챔피언 검색</label>
            <input id="searchInput" type="search" placeholder="챔피언 이름 검색" autocomplete="off" />
            <kbd>/</kbd>
          </div>

          <div id="roleFilters" class="filter-row" aria-label="역할군 필터">
            <button class="filter-chip is-active" type="button" data-role="all">전체</button>
            <button class="filter-chip" type="button" data-role="Tank">탱커</button>
            <button class="filter-chip" type="button" data-role="Fighter">전사</button>
            <button class="filter-chip" type="button" data-role="Assassin">암살자</button>
            <button class="filter-chip" type="button" data-role="Mage">마법사</button>
            <button class="filter-chip" type="button" data-role="Marksman">원거리</button>
            <button class="filter-chip" type="button" data-role="Support">서포터</button>
          </div>

          <div class="toolbar__bottom">
            <div id="statusFilters" class="segmented" aria-label="사용 상태 필터">
              <button class="is-active" type="button" data-status="all">모두</button>
              <button type="button" data-status="unused">미사용</button>
              <button type="button" data-status="used">사용 완료</button>
            </div>
            <div class="toolbar__actions">
              <span id="resultCount" class="result-count"></span>
              <button id="undoButton" class="text-button" type="button" disabled>실행 취소</button>
              <button id="resetButton" class="text-button text-button--danger" type="button">전체 초기화</button>
            </div>
          </div>
        </section>

        <section aria-live="polite">
          <div id="loadingState" class="state-card">
            <span class="spinner" aria-hidden="true"></span>
            <strong>챔피언을 불러오는 중...</strong>
            <p>Riot Data Dragon에서 최신 명단을 확인하고 있습니다.</p>
          </div>
          <div id="errorState" class="state-card state-card--error" hidden>
            <strong>챔피언 정보를 불러오지 못했어요.</strong>
            <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
            <button id="retryButton" type="button">다시 시도</button>
          </div>
          <div id="emptyState" class="state-card" hidden>
            <strong>조건에 맞는 챔피언이 없어요.</strong>
            <p>검색어나 필터를 바꿔보세요.</p>
          </div>
          <div id="championGrid" class="champion-grid" aria-label="챔피언 목록"></div>
        </section>
      </main>

      <footer>
        <span id="patchInfo">Data Dragon 연결 중</span>
        <span>개인용 팬 프로젝트 · Riot Games와 제휴 또는 보증 관계가 없습니다.</span>
      </footer>
    </div>

    <a
      class="stream-banner stream-banner--left"
      href="https://www.youtube.com/@%EC%88%98%ED%9E%9B"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="수힛 YouTube 채널 새 탭에서 열기"
      title="수힛 YouTube 채널 바로가기"
    >
      <img
        src="assets/youtube-banner.jpg"
        width="360"
        height="945"
        alt="마법사 고양이 캐릭터—수힛 YouTube 채널 바로가기"
      />
    </a>

    <a
      class="stream-banner stream-banner--right"
      href="https://www.sooplive.com/station/suhee0051"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="SOOP LIVE 방송국 새 탭에서 열기"
      title="SOOP LIVE 방송국 바로가기"
    >
      <img
        src="assets/soop-live-banner.jpg"
        width="360"
        height="945"
        alt="얼음 협곡의 고양이 캐릭터—SOOP LIVE 방송국 바로가기"
      />
    </a>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="championTooltip" class="champion-tooltip" role="tooltip" hidden></div>
  </body>
</html>
